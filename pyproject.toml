[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptile"
version = "0.1.0"
description = "Adaptive tiling (GridNet) cho YOLO + tiling"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "gpu: cần GPU, data/kayuan và weights (tự skip nếu thiếu)",
    "full: chạy trên toàn bộ tập test, chậm (bật bằng --full)",
]
