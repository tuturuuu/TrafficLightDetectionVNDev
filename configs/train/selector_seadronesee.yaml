# ─────────────────────────────────────────────────────────────────────────────
# Train tile selector trên SeaDroneSee (70/15/15)
#
#   python scripts/train_selector.py configs/train/selector_seadronesee.yaml
# ─────────────────────────────────────────────────────────────────────────────

type: gridnet                        # gridnet | tile_cnn
out: weights/gridnet_seadronesee_8x8_v2.pth

gridnet:
  images: data/seadrone_sequence/train/images
  labels: data/seadrone_sequence/train/labels
  val_images: data/seadrone_sequence/val/images
  val_labels: data/seadrone_sequence/val/labels
  grid_rows: 8
  grid_cols: 8
  epochs: 40
  batch_size: 32
  lr: 0.001
  pos_weight: 8.0
  threshold: 0.1
  patience: 10
  seed: 0

tile_cnn:
  train_images: data/seadrone_sequence/train_tiled_uniform/images
  train_labels: data/seadrone_sequence/train_tiled_uniform/labels
  val_images: data/seadrone_sequence/val_tiled_uniform/images
  val_labels: data/seadrone_sequence/val_tiled_uniform/labels
  img_size: 160
  batch_size: 64
  epochs: 40
  pos_weight: 2.0
  patience: 10                       # early stop theo loss trên val_images
  seed: 0
